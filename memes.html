<style>
.name-scripts{font-size:18px;line-height:1.8;color:var(--muted);margin:-10px 0 24px;letter-spacing:0}.name-scripts [lang="as"]{font-family:"Noto Serif Bengali",serif}.name-scripts [lang="ahom"]{font-family:"Noto Serif Ahom",serif}.name-separator{padding:0 8px}
:root{color-scheme:light;--bg:#f3e8cf;--panel:#f8f0df;--text:#352b21;--muted:#625342;--accent:#735021;--line:#d1bd96}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:100px}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif;line-height:1.75}a{color:inherit;text-underline-offset:5px}a:hover{color:var(--accent)}a:focus-visible{outline:2px solid var(--accent);outline-offset:6px}.wrap{width:min(1100px,calc(100% - 64px));margin:auto}.skip{position:fixed;top:-80px;left:20px;background:var(--accent);color:var(--bg);padding:10px;z-index:10}.skip:focus{top:12px}
header{border-bottom:1px solid var(--line);background:#f3e8cff5;position:sticky;top:0;z-index:5}.nav{display:flex;justify-content:space-between;align-items:center;min-height:82px;gap:24px}.brand{text-decoration:none;font-family:Georgia,serif;font-size:25px;font-weight:bold}.brand span{color:var(--accent)}nav{display:flex;gap:27px;font-size:14px}nav a{text-decoration:none;color:var(--muted)}
.hero{position:relative;display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:center;padding:100px 0 90px}.eyebrow{font-size:11px;font-weight:650;letter-spacing:2.3px;text-transform:uppercase;color:var(--accent);margin:0 0 24px}.eyebrow:before{content:"";display:inline-block;width:24px;height:1px;background:var(--accent);vertical-align:middle;margin-right:12px}h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(48px,6.6vw,82px);line-height:1.08;letter-spacing:-3px;margin:0 0 24px}.subtitle{font-family:Georgia,serif;font-size:27px;line-height:1.4;margin:0 0 22px;color:#51412e}.intro{color:var(--muted);max-width:520px;font-size:16px}.buttons{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}.button{border:1px solid var(--line);padding:11px 20px;text-decoration:none;font-size:13px;border-radius:5px}.primary{background:var(--accent);color:#f3e8cf;border-color:var(--accent);font-weight:650}.primary:hover{background:#5e401b;color:#f3e8cf}.affiliation{margin-top:28px;font-size:12px;color:var(--muted)}.art{position:relative;background:radial-gradient(ellipse at center,#d5ba7e88,transparent 70%);margin:0}.art svg{display:block;width:100%;height:auto}.art figcaption{text-align:center;font-family:monospace;color:#625342;font-size:11px;letter-spacing:1px}
section{padding:65px 0;border-top:1px solid var(--line)}.section-head{display:grid;grid-template-columns:240px 1fr;gap:48px}.section-label{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--accent);margin:0 0 10px}h2{font-family:Georgia,serif;font-size:34px;font-weight:400;line-height:1.25;margin:0 0 20px}p{margin:0 0 18px}.copy{color:var(--muted);font-size:16px}.copy strong{color:var(--text);font-weight:500}.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.tag{border:1px solid var(--line);border-radius:30px;padding:5px 12px;font-size:11px;color:#625342}.research-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}.card{background:linear-gradient(140deg,#faf3e5,#eee0c2);border:1px solid var(--line);border-radius:8px;padding:28px}.number{font:12px monospace;color:var(--accent)}h3{font-family:Georgia,serif;font-weight:400;font-size:24px;line-height:1.35;margin:25px 0 15px}.card p{font-size:14px;color:var(--muted);margin:0}.research-heading{display:flex;justify-content:space-between;align-items:end;gap:30px}.research-heading p{max-width:440px;color:var(--muted);font-size:14px}.paper{display:grid;grid-template-columns:70px 1fr auto;gap:25px;padding:28px 0;border-bottom:1px solid var(--line);align-items:start}.paper:last-child{border-bottom:0}.paper h3{margin:0 0 10px;font-size:23px}.paper p{font-size:14px;color:var(--muted);max-width:650px;margin:0}.year{color:var(--accent);font:13px monospace;padding-top:6px}.paper-link{font-size:13px;white-space:nowrap;padding-top:5px}.contact{background:linear-gradient(100deg,#ead8af,#f5ebd6);border:1px solid #cab185;border-radius:8px;padding:38px;display:flex;align-items:center;justify-content:space-between;gap:30px}.contact h2{font-size:30px;margin-bottom:10px}.contact p{color:var(--muted);max-width:660px;font-size:14px;margin:0}footer{padding:30px 0;color:var(--muted);font-size:12px}.footer-inner{display:flex;justify-content:space-between;gap:20px}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding:65px 0 55px;gap:15px}.art{max-width:380px;margin:auto}.section-head{grid-template-columns:1fr;gap:10px}.research-grid{grid-template-columns:1fr}.card{padding:25px}.card h3{margin-top:14px}.research-heading{display:block}.contact{display:block}.contact .button{display:inline-block;margin-top:24px}}
@media(max-width:520px){.wrap{width:calc(100% - 36px)}.nav{flex-wrap:wrap;gap:4px;padding:14px 0;min-height:88px}nav{gap:19px;font-size:12px;width:100%}.brand{font-size:22px}h1{letter-spacing:-2px}.subtitle{font-size:24px}.hero{padding-top:44px}.art{max-width:300px}section{padding:42px 0}.paper{grid-template-columns:1fr;gap:8px}.contact{padding:25px}.footer-inner{flex-direction:column;gap:5px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

/* Faded muga silk: warm gold with quiet woven texture */

.section-label{color:#85502f}
.primary{color:#fff8e9}

/* Landscape photograph across the top of the homepage */
.hero{isolation:isolate;min-height:520px}
.hero::before{content:"";position:absolute;z-index:-1;top:0;bottom:0;left:50%;width:100vw;transform:translateX(-50%);background-image:linear-gradient(to bottom,transparent 70%,#f3e8cf 100%),linear-gradient(90deg,#f3e8cff5 0%,#f3e8cfe6 37%,#f3e8cf66 75%,#f3e8cf40 100%),url('homepage-landscape.jpg');background-size:cover;background-position:center,center,center 48%;pointer-events:none}
.hero .art{background:radial-gradient(ellipse at center,#f3e8cfbb,transparent 72%)}

.hero-quotes{margin:28px 0;max-width:650px}
.hero-quotes blockquote{margin:0 0 20px;padding:12px 16px;border-left:2px solid #b79556;background:#f3e8cfe6;border-radius:0 5px 5px 0}
.hero-quotes blockquote p{font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.55;color:var(--text);margin:0 0 8px}
.hero-quotes blockquote footer{padding:0;font-family:Inter,"Segoe UI",Arial,sans-serif;font-size:12px;line-height:1.6;color:var(--muted)}
@media(max-width:520px){.hero-quotes blockquote p{font-size:17px}}

.meme-intro{padding:60px 0 32px}.meme-intro h1{font-size:clamp(42px,7vw,64px);letter-spacing:-1px}.meme-intro p{color:var(--muted)}
.meme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;padding-bottom:60px;align-items:start}
.meme-card{margin:0;background:#faf3e5;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.meme-card a{display:block}.meme-card img{display:block;width:100%;height:auto}.meme-card figcaption{padding:12px 16px;color:var(--muted);font-size:13px}
@media(max-width:650px){.meme-grid{grid-template-columns:1fr;gap:22px}}
