<style>
:root{color-scheme:light;--bg:#f4f1fc;--text:#343044;--muted:#686078;--accent:#70559b;--line:#dfd7ec}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:110px}
body{margin:0;color:var(--text);font-family:Inter,"Segoe UI",Arial,sans-serif;line-height:1.7;background:radial-gradient(ellipse at 5% 15%,#e3dbfa 0,transparent 48%),radial-gradient(ellipse at 95% 42%,#d8eee7 0,transparent 48%),radial-gradient(ellipse at 15% 90%,#f9dfdf 0,transparent 45%),var(--bg)}
a{color:inherit;text-underline-offset:5px}a:hover{color:var(--accent)}a:focus-visible{outline:3px solid var(--accent);outline-offset:6px}
.wrap{width:min(1100px,calc(100% - 64px));margin:auto}
.skip{position:fixed;top:-80px;left:20px;background:var(--accent);color:white;padding:10px;z-index:10}.skip:focus{top:12px}
header{position:sticky;top:0;z-index:5;background:#f7f4fcf5;border-bottom:1px solid var(--line)}
.nav{display:flex;justify-content:space-between;align-items:center;min-height:82px;gap:24px}
.brand{text-decoration:none;font-family:Georgia,serif;font-size:25px;font-weight:bold}.brand span{color:var(--accent)}
nav{display:flex;gap:27px;font-size:14px}nav a{text-decoration:none;color:var(--muted)}
.meme-intro{text-align:center;padding:64px 0 38px}
.eyebrow{display:inline-block;margin:0 0 20px;padding:6px 16px;background:#e7def5;border:1px solid #d9cbee;border-radius:30px;color:var(--accent);font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase}
h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(48px,8vw,76px);letter-spacing:-2px;line-height:1.1;margin:0 0 18px}
.meme-intro p:last-child{color:var(--muted);margin:0;font-size:16px}
.meme-grid{columns:2;column-gap:30px;max-width:1000px;margin:0 auto;padding:8px 0 48px}
.meme-card{display:inline-block;vertical-align:top;width:100%;break-inside:avoid;margin:0 0 30px;padding:12px;background:#e6def5;border:1px solid #ffffffb3;border-radius:20px;box-shadow:0 5px 20px #49355c0d}
.meme-card:nth-child(3n+2){background:#dceee7}.meme-card:nth-child(3n){background:#f4dfe3}
.meme-card a{display:block;border-radius:10px;overflow:hidden;background:#fff;transition:transform .18s ease,box-shadow .18s ease}
.meme-card a:hover{transform:translateY(-3px);box-shadow:0 6px 18px #49355c18}
.meme-card img{display:block;width:100%;height:auto}
footer{padding:26px 0;color:var(--muted);font-size:12px;border-top:1px solid var(--line);background:#f7f4fc80}
.footer-inner{display:flex;justify-content:space-between;gap:20px}
@media(max-width:650px){.meme-grid{columns:1;max-width:480px}.meme-card{margin-bottom:24px;padding:10px;border-radius:16px}.meme-intro{padding:42px 0 28px}}
@media(max-width:520px){.wrap{width:calc(100% - 36px)}.nav{flex-wrap:wrap;gap:4px;padding:14px 0;min-height:88px}.brand{font-size:22px}nav{gap:19px;font-size:12px;width:100%;flex-wrap:wrap}.footer-inner{flex-direction:column;gap:5px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.meme-card a{transition:none}.meme-card a:hover{transform:none}}
@media(max-width:650px){nav{flex-wrap:wrap;row-gap:8px}}

/* Mobile navigation and touch controls */
html{-webkit-text-size-adjust:100%}
.nav-toggle{display:none;font-family:inherit;font-size:14px;font-weight:500;line-height:1.2;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:6px;min-height:44px;padding:10px 14px;align-items:center;gap:10px;cursor:pointer}
.nav-toggle[hidden]{display:none}.nav-toggle svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6}
button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
main,.copy,.card,.publication,.talk>div{min-width:0}h1,h2,h3,p,li{overflow-wrap:break-word}
@media(max-width:820px){
 html{scroll-padding-top:90px}
 .wrap{width:calc(100% - 36px)}
 header{position:sticky;top:0;z-index:5}
 .nav{min-height:72px;padding:12px 0;gap:0 16px;flex-wrap:wrap}
 .brand{font-size:23px}
 .nav-toggle:not([hidden]){display:inline-flex;margin-left:auto}
 nav{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 8px;font-size:14px;padding:12px 0 2px}
 nav a{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:5px}
 nav a:hover,nav a:focus-visible{background:var(--line)}
 .mobile-nav-ready nav{display:none}.mobile-nav-ready.menu-open nav{display:grid}
 .button{display:inline-flex;align-items:center;justify-content:center;min-height:46px;font-size:14px;padding:11px 18px}
 .footer-inner{flex-wrap:wrap}
}
@media(max-width:380px){.wrap{width:calc(100% - 28px)}.brand{font-size:21px}}

@media(max-width:820px){
 .meme-intro{padding:40px 0 26px}
 .meme-intro h1{font-size:56px}
 .eyebrow{font-size:10px;letter-spacing:1px;max-width:100%}
 .meme-grid{columns:1;max-width:520px;padding-bottom:28px}
 .meme-card{padding:8px;border-radius:14px;margin-bottom:22px}
 .meme-card a{border-radius:7px}
}
@media(hover:none){.meme-card a:hover{transform:none;box-shadow:none}}

</style>
